# svj_delphes_test configuration
# Edit values here and re-run the binary -- no recompilation needed.
#
# This binary computes BOTH truth-level and Delphes-level observables from
# the SAME Pythia events (one physics point, nEvent events, paired per row --
# see svj_delphes_test.cc's file header for why). There is no separate
# "truth" cfg to keep in sync: every event is clustered both ways internally.

mZ         = 1500.0   # Z' mass (GeV)
LambdaDQCD = 10.5      # dark QCD confinement scale (GeV)
mPi        = 10.4     # dark pion mass (GeV)
mRho       = 15.1     # dark rho mass (GeV)
mq         = 4.55     # dark quark mass (GeV)

rinv_pion  = 0.7      # dark pion invisible BR
rinv_rho   = 0.2      # dark rho invisible BR
Brmu       = 0.7      # fraction of visible dark-rho decays to mu+mu-
alphaD     = 0.3      # dark coupling alpha_D

nEvent     = 20000     # Stage-0 default: an order of magnitude below svj_regression's usual 50000,
                      # since Delphes adds real per-event cost on top of Pythia8+FastJet
jetR       = 0.4      # anti-kt jet radius -- same parameter/value the truth pipeline uses;
                      # svj_delphes_particles.tcl has no jetR-equivalent setting at all
vis_jet_pt_min = 20.0 # min visible pT (GeV) for a jet to enter the analysis

tsv_file     = simulated/tsv/jets_delphes_paired.tsv
delphes_card = src/generate_events/svj_delphes_particles.tcl

# Leave empty for a normal run. To investigate specific events (e.g. the
# largest leadVisPt outliers found via
# `compare_delphes_truth.py --top-diff 10 leadVisPt`), paste the printed
# eventIndex list here and re-run -- the fixed Pythia seed above means the
# same indices regenerate the exact same events, and this time their
# leading-jet constituents (both truth and Delphes side) are additionally
# written out for plot_lego.py. Leaving this empty (the default) touches
# neither of the two constituents_*_file paths below.
# dump_events = 4237,891,55
dump_events =796,2729,8025,9886,5057,7584,1818,5279,2864,1687

constituents_truth_file   = simulated/tsv/jets_delphes_constituents_truth.tsv
constituents_delphes_file = simulated/tsv/jets_delphes_constituents_delphes.tsv
