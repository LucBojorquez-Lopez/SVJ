# svj_regression_delphes configuration
# Edit values here and re-run the binary -- no recompilation needed.
#
# Delphes-level counterpart to svj_regression.cfg. Physics keys match
# svj_regression.cfg exactly; single-threaded by design (see
# svj_regression_delphes.cc's file header), so there is no nWorkers key.

mZ         = 500.0   # Z' mass (GeV)
LambdaDQCD = 10.5      # dark QCD confinement scale (GeV)
mPi        = 10.4     # dark pion mass (GeV)
mRho       = 15.1     # dark rho mass (GeV)
mq         = 4.55     # dark quark mass (GeV)

rinv_pion  = 0.5      # dark pion invisible BR
rinv_rho   = 0.5      # dark rho invisible BR
Brmu       = 0.7      # fraction of visible dark-rho decays to mu+mu-
alphaD     = 0.3      # dark coupling alpha_D

nEvent     = 50000    # total number of events
jetR       = 1.0      # anti-kt jet radius -- plain scan parameter, never baked
                      # into the Delphes card (svj_delphes_particles.tcl has no
                      # jetR-equivalent setting at all)
# seed_offset = 0     # seed = 1 + seed_offset; for batch generation with
                      # multiple independent runs (mirrors svj_regression.cfg's
                      # seed_offset, but this binary is single-threaded so
                      # there is only ever one seed per run, not a range)
jets_vis_only  = 1
dijet_only     = 0
vis_jet_pt_min = 20.0

tsv_file     = simulated/tsv/jets_delphes.tsv
delphes_card = src/generate_events/svj_delphes_particles.tcl
