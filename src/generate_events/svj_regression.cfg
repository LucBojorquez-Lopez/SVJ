# svj_regression configuration
# Edit values here and re-run the binary — no recompilation needed.

# To pick a test point, choose mPiOverLambda and LambdaDQCD, then compute:
#   mPi  = mPiOverLambda * LambdaDQCD
#   mRho = LambdaDQCD * (5.76 + 1.5 * mPiOverLambda**2)**0.5
#   mq   = LambdaDQCD * (mPiOverLambda / 5.5)**2
# Default below: mPiOverLambda = 1.6, LambdaDQCD = 6.5

mZ         = 3000.0   # Z' mass (GeV)
LambdaDQCD = 6.5      # dark QCD confinement scale (GeV)
mPi        = 10.4     # dark pion mass (GeV)   [= mPiOverLambda * LambdaDQCD = 1.6 * 6.5]
mRho       = 20.1     # dark rho mass (GeV)    [= LambdaDQCD * sqrt(5.76 + 1.5 * 1.6^2)]
mq         = 0.55     # dark quark mass (GeV)  [= LambdaDQCD * (mPiOverLambda/5.5)^2]

rinv_pion  = 0.2      # dark pion invisible BR
rinv_rho   = 0.7      # dark rho invisible BR
Brmu       = 0.3      # fraction of visible dark-rho decays to mu+mu-  (lep_br = Brmu*(1-rinv_rho))
alphaD     = 0.6      # dark coupling alpha_D
nEvent     = 50000    # total number of events
jetR       = 1.0      # anti-kt jet radius
nWorkers   = 16       # parallel worker threads
# seed_offset = 0    # shifts PYTHIA seeds: seed = workerID+1 + seed_offset*nWorkers
                     # set automatically by run_svj_tsv.sh; leave unset for single runs
save_tsv      = 1     # write simulated/tsv/jets_default.tsv (set to 0 during scan)
jets_vis_only = 1     # 1 = store visible jet 4-momenta in jets_kinematics.tsv; 0 = full jet (incl. invisible)
dijet_only    = 0     # 1 = only keep events with >= 2 jets (dijet topology); 0 = all events
vis_jet_pt_min = 20.0 # min visible pT (GeV) for a jet to enter the analysis
