# svj_regression configuration
# Edit values here and re-run the binary — no recompilation needed.

mZ         = 4000.0   # Z' mass (GeV)
mq         = 4.0      # dark quark mass (GeV)
mPi        = 8    # dark pion mass (GeV)  [= 8/15.5 * mRho; update if mRho changes]
mRho       = 15.5     # dark rho mass (GeV)
rinv_pion  = 0.18     # dark pion invisible BR
rinv_rho   = 0.18     # dark rho invisible BR
Brmu       = 0.3      # fraction of visible dark-rho decays to mu+mu-  (lep_br = Brmu*(1-rinv_rho))
alphaD     = 0.1      # dark coupling alpha_D
nEvent     = 500    # total number of events
jetR       = 1.0      # anti-kt jet radius
LambdaDQCD = 5    # dark QCD confinement scale (GeV)  [= 5/15.5 * mRho; update if mRho changes]
nWorkers   = 14       # parallel worker threads
# seed_offset = 0    # shifts PYTHIA seeds: seed = workerID+1 + seed_offset*nWorkers
                     # set automatically by run_svj_tsv.sh; leave unset for single runs
save_tsv      = 1     # write simulated/tsv/jets_default.tsv (set to 0 during scan)
jets_vis_only = 1     # 1 = store visible jet 4-momenta in jets_kinematics.tsv; 0 = full jet (incl. invisible)
dijet_only    = 0     # 1 = only keep events with >= 2 jets (dijet topology); 0 = all events
vis_jet_pt_min = 20.0 # min visible pT (GeV) for a jet to enter the analysis
