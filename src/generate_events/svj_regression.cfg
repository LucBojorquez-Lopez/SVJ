# svj_regression configuration
# Edit values here and re-run the binary — no recompilation needed.

mZ         = 1000.0   # Z' mass (GeV)
mq         = 4.0      # dark quark mass (GeV)
mPi        = 7.742    # dark pion mass (GeV)  [= 8/15.5 * mRho; update if mRho changes]
mRho       = 15.0     # dark rho mass (GeV)
rinv       = 0.45     # dark pion invisible BR
rinv2      = 0.70     # dark rho invisible BR
Brl        = 0.3      # fraction of visible dark-rho decays to mu+mu-  (lep_br = Brl*(1-rinv2))
alphaD     = 0.1      # dark coupling alpha_D
nEvent     = 50000    # total number of events
jetR       = 1.0      # anti-kt jet radius
LambdaDQCD = 4.839    # dark QCD confinement scale (GeV)  [= 5/15.5 * mRho; update if mRho changes]
nWorkers   = 14       # parallel worker threads
save_tsv      = 1     # write data/regression/jets_default.tsv (set to 0 during scan)
jets_vis_only = 1     # 1 = store visible jet 4-momenta in jets_kinematics.tsv; 0 = full jet (incl. invisible)
dijet_only    = 0     # 1 = only keep events with >= 2 jets (dijet topology); 0 = all events
vis_jet_pt_min = 100.0 # min visible pT (GeV) for a jet to enter the analysis
