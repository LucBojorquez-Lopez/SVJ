# scan_smoke.cfg
# One grid point, 2000 events — the smallest thing that still exercises the
# whole scan path: C++ generation, observable transforms, marginal fits, the
# copula, and the NPZ write.  Runs in well under a minute.
#
# This is the config for the mandatory single-job Condor smoke test in
# docs/lxplus.md §7.3.  It is selected via SVJ_SCAN_CFG, not by editing
# scan_regression.cfg:
#
#     condor_submit condor/smoke.sub
#
# The grid point matches the default in svj_regression.cfg (mPiOverLambda=1.6,
# LambdaDQCD=6.5), so its output is directly comparable to a local binary run.
#
# output_dir writes to simulated_smoke/, NOT simulated/ — a one-point scan with
# n_jobs=1 is named svj_scan.npz, which would otherwise overwrite the committed
# 6-axis production scan at simulated/svj/svj_scan.npz.

[scan]
mZ            = 1500, 1500, 1
rinv_pion     = 0.3, 0.3, 1
mPiOverLambda = 1.6, 1.6, 1
LambdaDQCD    = 6.5, 6.5, 1
alphaD        = 0.4, 0.4, 1
jetR          = 1.0, 1.0, 1

[fixed]
Brmu = 0.3

[derived]
mq       = LambdaDQCD * (mPiOverLambda / 5.5) ** 2
mPi      = mPiOverLambda * LambdaDQCD
mRho     = LambdaDQCD * (5.76 + 1.5 * mPiOverLambda ** 2) ** 0.5
rinv_rho = rinv_pion

[simulation]
nEvent           = 2000
nWorkers         = 1
n_outer_workers  = 1
checkpoint_every = 200
output_dir       = simulated_smoke
