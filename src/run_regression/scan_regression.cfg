# scan_regression.cfg
# Parameter scan configuration for SVJ regression.
#
# Three parameter zones — every physics parameter must appear in exactly one:
#
#   [scan]       — axes of the grid; format: name = min, max, n[, spacing]
#                  spacing = linear (default) or log
#   [fixed]      — constant across all grid points
#   [derived]    — computed from other parameters via safe arithmetic expressions
#                  (only +, -, *, / and parentheses; no imports or builtins)
#
# Adding a new scan axis:
#   1. Move the parameter from [fixed] or [derived] into [scan] with min,max,n.
#   2. Adjust [derived] if any expression depended on it as a free variable.
#
# [simulation]  — non-physics settings (not passed to the C++ binary as physics).

[scan]
mZ        = 500, 4000, 8
mRho      = 10, 30, 8
rinv_pion = 0.05, 0.70, 8
alphaD    = 0.10, 0.80, 8

[fixed]
mq   = 4.0    # dark quark mass (GeV)
Brmu = 0.3    # fraction of visible dark-rho decays going to mu+mu-
jetR = 1.0    # anti-kt jet radius

[derived]
# Expressions are evaluated with scan+fixed param names in scope.
mPi        = mRho * (8.0 / 15.5)    # keeps mRho/mPi ratio fixed
LambdaDQCD = mRho * (5.0 / 15.5)    # keeps mRho/Lambda ratio fixed
rinv_rho   = rinv_pion               # tie dark-rho to dark-pion invisible BR

[simulation]
nEvent           = 50000   # events per grid point  (use 1000 to test)
nWorkers         = 1       # C++ threads per grid point (outer loop handles parallelism)
n_outer_workers  = 48      # simultaneous grid points; total threads = n_outer * nWorkers
checkpoint_every = 200     # save intermediate NPZ every N completed points
output_dir       = simulated
