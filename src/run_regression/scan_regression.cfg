# scan_regression.cfg
# Parameter scan configuration for SVJ regression.
# Edit ranges and grid sizes here; no recompilation needed.
#
# Derived automatically (do not set here):
#   mPi      = mRho * (8.0 / 15.5)   — keeps mrho/mpion ratio fixed
#   LambdaQCD = mRho * (5.0 / 15.5)  — keeps mrho/Lambda ratio fixed

# ── Scan axes ────────────────────────────────────────────────────────────────
mZ_min     = 500.0
mZ_max     = 4000.0
mZ_n       = 16

mRho_min   = 10.0
mRho_max   = 30.0
mRho_n     = 8

rinv_min   = 0.05
rinv_max   = 0.70
rinv_n     = 8

alphaD_min = 0.10
alphaD_max = 0.80
alphaD_n   = 8

# ── Fixed physics parameters ─────────────────────────────────────────────────
mq    = 4.0    # dark quark mass (GeV)
rinv2 = 0.3    # dark rho invisible BR; DOESNT MATTER, SET TO RINV IN THE REGRESSION CODE
Brl   = 0.3    # dark rho -> mu mu BR  (must satisfy Brl + rinv2 <= 1)
jetR  = 1.0    # anti-kt jet radius

# ── Simulation settings per point ────────────────────────────────────────────
nEvent   = 50000   # events per grid point (use 1000 to test, 10000 for production)
nWorkers = 1       # internal C++ threads per grid point
                   #   scan_regression_gennorm.py parallel: 1 (all parallelism is outer)
                   #   scan_regression.py serial:           set to all available cores

# ── Parallelisation (scan_regression_gennorm.py only) ────────────────────────
n_outer_workers  = 48    # simultaneous grid points; total threads = n_outer_workers * nWorkers
checkpoint_every = 200   # save intermediate NPZ every N completed points

# ── Observable mode ──────────────────────────────────────────────────────────
full_obs = 0   # 0 = skip extra observables during scan (only leadVisPt/leadWidth/MET needed)
               # scan_regression_gennorm.py overrides this to 1 internally

# ── Output ───────────────────────────────────────────────────────────────────
output_dir  = simulated
output_file = regression_scan.npz
