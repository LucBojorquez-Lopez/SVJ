# Production raw-capture scan — DELPHES stream (detector level).
#
# Paired with scan_prod_truth.cfg; the only difference is the `binary` key below.
# Run both and you can compare truth against detector level at every grid point
# without simulating anything twice.
#
# Purpose is the RAW STORE, not the fitted NPZ: every observable the generator
# computes is written to disk (see docs/raw-store.md), so any later scan — a
# different observable subset, a different transform pipeline, a symbolic
# regression target — is a fit_raw.py run of minutes rather than a re-simulation
# of ~900 CPU-hours.
#
# output_dir is deliberately OUTSIDE the repository: it holds tens of GB, and
# the default 'simulated' would overwrite the committed svj_scan.npz.

[scan]
mZ            = 500, 4000, 8, log
rinv_pion     = 0.05, 0.70, 8
# Lower bound 0.1, not 0.0: mPiOverLambda = 0 gives a massless dark pion AND a
# massless dark quark.  0.1 was checked to run cleanly at all four extreme
# corners of (LambdaDQCD, mZ), with 95-100% event acceptance.
mPiOverLambda = 0.1, 2.0, 4
LambdaDQCD    = 2.0, 15.0, 4
alphaD        = 0.1, 0.6, 4
jetR          = 0.4, 1.2, 4

[fixed]
Brmu = 0.3

[derived]
mq       = LambdaDQCD * (mPiOverLambda / 5.5) ** 2
mPi      = mPiOverLambda * LambdaDQCD
mRho     = LambdaDQCD * (5.76 + 1.5 * mPiOverLambda ** 2) ** 0.5
rinv_rho = rinv_pion

[simulation]
nEvent           = 20000
nWorkers         = 1       # C++ threads per point; the outer pool parallelises
n_outer_workers  = 1       # one core per job -- see docs/raw-store.md on slot sizing
checkpoint_every = 4       # MUST be < points-per-job (16384/queue N).
                           # At queue 512 a job does 32 points, so the old
                           # value of 50 meant the raw index was never
                           # flushed mid-job -- and a headerless .f32 with
                           # no index is unreadable, so an evicted job lost
                           # everything it had computed.
output_dir       = /eos/user/l/lbojorqu/svj/prod/delphes

# Switches the whole scan to detector level.  scan_svj.py renames its outputs to
# svj_regression_delphes_scan*.npz / _raw.f32 automatically, so the two streams
# cannot overwrite each other even if output_dir were shared.
#
# nWorkers above is ignored here: the binary is single-threaded by construction
# (ROOT's gRandom is not thread-safe), so all parallelism is n_outer_workers.
binary           = svj_regression_delphes
